; Assassin's Creed II Raw Mouse Fix
; Keep this file beside AssassinsCreedIIRawMouseFix.asi.

[Fix]
; 1 = load the fix; 0 = leave the game completely unmodified.
Enabled=1
; 1 = the third-person camera turns by raw mouse counts (no acceleration, no per-frame
;     limit, the same turn per count at any frame rate); 0 = the game's own curve.
LinearCamera=1
; 1 = in game: F8 toggles LinearCamera, F9/F10 lower/raise SensitivityMultiplier by 10 %
;     (until the game closes), F6 reloads this file.
Hotkeys=1
; 1 = write input statistics to ac2-raw-mouse-fix.log every five seconds.
Diagnostics=0

[Sensitivity]
; Camera turn per mouse count: higher turns faster. Each camera in the game has its own speed
; on top of these, and the game's look-sensitivity sliders still apply too. With the default
; camera and sliders, SensitivityX=50 is 0.079 degrees per count, or 4570 counts for a full
; turn. For the physical distance of a full turn: cm = 4570 * 50 / SensitivityX / DPI * 2.54.
SensitivityX=50
; Vertical. Cameras differ the most here; 50 turns about 0.07 to 0.14 % of the pitch range
; per count.
SensitivityY=50
; Scales both of the above. 1.00 = as they are.
SensitivityMultiplier=1.00
